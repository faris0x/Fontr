plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.18-SNAPSHOT'
	id 'ploceus' version '1.18-SNAPSHOT'
}

base {
	archivesName = project.archives_base_name
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
	maven {
		name = 'Polyfrost Releases'
		url = 'https://repo.polyfrost.org/releases'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)
	ploceus.dependOsl(project.osl_version)

	// Provided by OneConfig/OneClient at runtime. Do not bundle these.
	compileOnly("org.polyfrost.oneconfig:config:${project.oneconfig_version}") { transitive = false }
	compileOnly("org.polyfrost.oneconfig:config-impl:${project.oneconfig_version}") { transitive = false }
	compileOnly("org.polyfrost.oneconfig:hud:${project.oneconfig_version}") { transitive = false }
}

ploceus {
	setIntermediaryGeneration(2)
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	withSourcesJar()
}

jar {
	manifest {
		attributes(
			'Implementation-Title': 'Fontr',
			'Implementation-Version': project.version
		)
	}
}
